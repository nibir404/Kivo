services:
  api:
    build: ./backend
    ports: ["8080:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://tandem:tandem@postgres/tandem
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: tandem, POSTGRES_PASSWORD: tandem, POSTGRES_DB: tandem }
  redis:
    image: redis:7
